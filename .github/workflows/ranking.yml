name: マーケット速報（ランキング）

on:
  # 定時実行は常駐スケジューラー（scheduler.yml）に移行。手動実行用に残す
  workflow_dispatch:
    inputs:
      session:
        description: "前場(am)／大引け(pm)"
        type: choice
        options: ["auto", "am", "pm"]
        default: "auto"
      notify:
        description: "Discord通知"
        type: choice
        options: ["off", "on"]
        default: "off"

jobs:
  ranking:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 順番待ちの後でも最新の状態から始める（古い履歴で二重通知しないため）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas lxml html5lib beautifulsoup4 jpholiday yfinance openpyxl xlrd
      - name: ランキング取得・通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_RANKING: ${{ secrets.DISCORD_WEBHOOK_RANKING }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then EXTRA="--ignore-holiday"; fi
          python scripts/ranking.py --session ${{ inputs.session || 'auto' }} --notify ${{ inputs.notify || 'on' }} $EXTRA
