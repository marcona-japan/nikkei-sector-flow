name: TDnet開示チェック

on:
  schedule:
    # 平日 8:00〜20:30 JST に30分ごと（UTC表記）
    - cron: "*/30 23 * * 0-4"
    - cron: "*/30 0-11 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "対象日 YYYY-MM-DD（空欄＝今日と前日）"
        required: false
      notify:
        description: "Discord通知"
        type: choice
        options: ["off", "auto", "force"]
        default: "off"

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  tdnet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 開示チェック
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_TDNET: ${{ secrets.DISCORD_WEBHOOK_TDNET }}
        run: |
          ARGS="--notify ${{ inputs.notify || 'auto' }}"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          python scripts/tdnet.py $ARGS
      - name: 結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data/tdnet.json data/tdnet_seen.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "tdnet: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git pull --rebase -q && git push
