name: 週末相場（日曜）

on:
  schedule:
    - cron: "0 9 * * 0"   # 日曜 18:00 JST
  workflow_dispatch:
    inputs:
      notify:
        description: "Discord通知"
        type: choice
        options: ["off", "on"]
        default: "off"

jobs:
  weekend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests yfinance
      - name: 通知
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_MARKET: ${{ secrets.DISCORD_WEBHOOK_MARKET }}
        run: python scripts/weekend.py --notify ${{ inputs.notify || 'on' }}
