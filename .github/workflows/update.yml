name: セクター資金移動の更新

on:
  schedule:
    # 30分枠が終わって約20分後に集計・場中速報（9:50〜15:50 JST の :20 と :50。昼休みは新しい枠がないので送らない）
    - cron: "50 0 * * 1-5"       # 09:50 JST
    - cron: "20,50 1-6 * * 1-5"  # 10:20〜15:50 JST
    - cron: "0 7 * * 1-5"        # 16:00 JST 大引け確定＋日次レポート
    - cron: "40 7 * * 1-5"       # 16:40 JST 予備（未通知のときだけ送る）
  workflow_dispatch:
    inputs:
      date:
        description: "集計日 YYYY-MM-DD（空欄＝今日）"
        required: false
      notify:
        description: "Discord通知"
        type: choice
        options: ["off", "auto", "force"]
        default: "off"

permissions:
  contents: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 順番待ちの後でも最新の状態から始める（古い履歴で二重通知しないため）
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 集計
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          ARGS="--notify ${{ inputs.notify || 'auto' }}"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          python scripts/run.py $ARGS
      - name: 集計（グロース250）
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          ARGS="--universe g250 --notify ${{ inputs.notify || 'auto' }}"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          python scripts/run.py $ARGS
      - name: 結果を保存
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data data
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "data: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git pull --rebase -q && git push
