name: FX決済リマインド

on:
  # 定時実行は常駐スケジューラー（scheduler.yml）に移行。手動実行用に残す
  workflow_dispatch:
    inputs:
      notify:
        description: "Discord通知"
        type: choice
        options: ["off", "on"]
        default: "off"
      test:
        description: "テスト送信（待たずに今すぐ2通送る）"
        type: boolean
        default: false

jobs:
  closing:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: リマインド
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_MARKET: ${{ secrets.DISCORD_WEBHOOK_MARKET }}
        run: python scripts/closing.py --notify ${{ inputs.notify || 'on' }} ${{ inputs.test && '--test' || '' }}
