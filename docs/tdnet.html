<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>監視銘柄の適時開示</title>
<meta name="description" content="監視銘柄のTDnet適時開示を日付ごとに一覧表示">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<style>
:root{color-scheme:light;--bg:#f4f3ef;--surface:#fcfcfb;--line:#e4e2dc;--grid:#ecebe6;--text:#0b0b0b;--text2:#52514e;--muted:#7a7873;--accent:#0b0b0b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#121211;--surface:#1a1a19;--line:#2e2e2b;--grid:#262624;--text:#fff;--text2:#c3c2b7;--muted:#95948b;--accent:#fff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#121211;--surface:#1a1a19;--line:#2e2e2b;--grid:#262624;--text:#fff;--text2:#c3c2b7;--muted:#95948b;--accent:#fff}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;-webkit-text-size-adjust:100%;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
nav{display:flex;gap:6px;padding-top:12px}
nav a{font-size:12.5px;color:var(--text2);text-decoration:none;padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
nav a[aria-current]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
header{padding:12px 0 6px}
h1{font-size:19px;margin:0}
.sub{color:var(--text2);font-size:12.5px}
.tools{display:flex;gap:8px;margin:10px 0 6px}
input[type=search]{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text)}
.seg{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;font:inherit;font-size:12.5px;padding:5px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface);color:var(--text2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}
h2{font-size:13px;color:var(--text2);margin:16px 0 6px;font-weight:600}
.item{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.item:active{opacity:.7}
.row1{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--text2)}
.row1 .t{font-variant-numeric:tabular-nums}
.row1 .co{color:var(--text);font-weight:650}
.tag{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.title{font-size:14px;margin-top:3px;line-height:1.45}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-size:13px}
footer{color:var(--muted);font-size:11.5px;padding:12px 0}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="./">セクター資金移動</a><a href="tdnet.html" aria-current="page">適時開示</a></nav>
  <header>
    <h1>監視銘柄の適時開示</h1>
    <div class="sub" id="meta">読み込み中…</div>
  </header>
  <div class="tools"><input type="search" id="q" placeholder="銘柄名・コード・キーワードで絞り込み" aria-label="絞り込み"></div>
  <div class="seg" id="tags"></div>
  <div id="list"></div>
  <footer>データ: やのしん TDnet WebAPI（TDnetの公開情報）。平日8:00〜20:30に30分ごと更新。開示本文はタップでPDFを開きます。投資判断はご自身で。</footer>
</div>
<script>
const $ = s => document.querySelector(s);
let ALL = [], tag = 'すべて';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('data/tdnet.json', {cache:'no-store'}).then(r => r.json()).then(d => {
  ALL = d.items;
  $('#meta').textContent = `監視${d.watch}銘柄 ・ 直近60日 ${ALL.length}件 ・ 更新 ${d.updated.slice(5).replace('-', '/')}`;
  const tags = ['すべて', ...new Set(ALL.map(x => x.tag))];
  $('#tags').innerHTML = tags.map(t => `<button aria-pressed="${t===tag}">${esc(t)}</button>`).join('');
  $('#tags').querySelectorAll('button').forEach(b => b.onclick = () => { tag = b.textContent; $('#tags').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); render(); });
  render();
}).catch(() => { $('#meta').textContent = 'まだデータがありません'; });
$('#q').oninput = render;
function render(){
  const q = $('#q').value.trim().toLowerCase();
  const xs = ALL.filter(x => (tag === 'すべて' || x.tag === tag) &&
    (!q || (x.code + x.name + x.title).toLowerCase().includes(q)));
  if (!xs.length) { $('#list').innerHTML = '<p class="empty">該当する開示はありません</p>'; return; }
  let h = '', cur = '';
  for (const x of xs){
    const d = x.time.slice(0, 10);
    if (d !== cur){ cur = d; const dt = new Date(d + 'T00:00:00+09:00');
      h += `<h2>${dt.getMonth()+1}/${dt.getDate()}(${'日月火水木金土'[dt.getDay()]})</h2>`; }
    h += `<a class="item" href="${esc(x.url)}" target="_blank" rel="noopener">
      <div class="row1"><span class="t">${x.time.slice(11)}</span><span class="co">${esc(x.code)} ${esc(x.name)}</span><span class="tag">${x.emoji} ${esc(x.tag)}</span></div>
      <div class="title">${esc(x.title)}</div></a>`;
  }
  $('#list').innerHTML = h;
}
</script>
</body>
</html>
